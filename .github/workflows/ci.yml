name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - name: Verify packed CLI bins
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npm pack --pack-destination "$tmp" >/dev/null
          tar -xOzf "$tmp"/*.tgz package/package.json | node --input-type=commonjs -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const [name, path] of Object.entries({
              "argo-workflows-axi": "dist/bin/argo-workflows-axi.js",
              "argo-workflows-axi-ctx": "dist/bin/argo-workflows-axi-ctx.js",
            })) {
              if (pkg.bin?.[name] !== path) throw Error(`missing packed bin ${name}: ${pkg.bin?.[name]}`);
              if (!fs.existsSync(path)) throw Error(`missing bin file ${path}`);
            }
          '
      - run: pnpm run check:skill
      - run: pnpm test
