name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 24]
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - name: Verify packed CLI bins
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npm pack --pack-destination "$tmp" >/dev/null
          tar -xzf "$tmp"/*.tgz -C "$tmp"
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const pathModule = require("node:path");
            const pkg = JSON.parse(fs.readFileSync(pathModule.join(process.argv[1], "package/package.json"), "utf8"));
            for (const [name, target] of Object.entries({
              "argo-workflows-axi": "dist/bin/argo-workflows-axi.js",
              "argo-workflows-axi-ctx": "dist/bin/argo-workflows-axi-ctx.js",
            })) {
              if (pkg.bin?.[name] !== target) throw Error(`missing packed bin ${name}: ${pkg.bin?.[name]}`);
              if (!fs.existsSync(pathModule.join(process.argv[1], "package", target))) throw Error(`missing packed bin file ${target}`);
            }
          ' "$tmp"
      - run: pnpm run check:skill
      - run: pnpm test
