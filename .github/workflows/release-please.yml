name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for recovery)
        required: false
        type: string

# Every job elevates only the scopes it needs.
permissions: {}

# Never run two releases at once, and never cancel a publish midway.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      # Commit the release PR's changes, then tag and create the GitHub release.
      contents: write
      # Open and update the release PR.
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # A separate job so install and package lifecycle scripts never hold repository
  # write access. If it fails, "Re-run failed jobs" retries it with the outputs
  # of the release-please job above.
  publish:
    needs: release-please
    if: ${{ always() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): npm mints a short-lived token and signs
      # provenance, so no npm secret is stored.
      id-token: write
    steps:
      - name: Validate recovery tag
        if: ${{ inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^argo-workflows-axi-v[0-9]+(\.[0-9]+)*([+-][0-9A-Za-z.-]+)?$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 ships npm 11, which trusted publishing requires.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run check:skill
      - run: pnpm test

      - name: Stage npm package
        run: |
          npm stage publish --access public --provenance > "$RUNNER_TEMP/stage-publish.log"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          let stageId = 'unavailable';
          try {
            const output = fs.readFileSync(`${process.env.RUNNER_TEMP}/stage-publish.log`, 'utf8');
            stageId = output.match(/\(staged with id ([^)]+)\)/)?.[1] || 'unavailable';
          } catch {}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `Stage ID: ${stageId}`,
            `Package: ${pkg.name}`,
            `Version: ${pkg.version}`,
            'Waiting for approval: run axi-approve',
            '',
          ].join('\n'));
          NODE
